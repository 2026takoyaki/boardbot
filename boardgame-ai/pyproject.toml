[project]
name = "boardgame-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["core*", "bridge*", "vision*", "games*", "audio*", "backend*", "agents*", "benchmarks*", "bulb*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.5",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bulb", "core", "vision", "bridge", "games", "audio", "backend", "agents", "benchmarks"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["vision.*", "games.*", "audio.*", "backend.*"]
disallow_untyped_defs = false

# 타입 스텁을 제공하지 않는 서드파티. 설치되어 있을 때만 mypy가 보게 되므로,
# 개발 환경마다 오류 수가 달라지는 것을 막는다.
[[tool.mypy.overrides]]
module = ["google.cloud.*", "openai.*", "yeelight.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
